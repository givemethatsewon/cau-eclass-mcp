[package]
name = "cau-eclass-mcp-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental Rust core for the CAU e-Class MCP"
license = "LicenseRef-CAU-EClass-Noncommercial-1.0"
publish = false

[lib]
name = "eclass_core"
path = "src/lib.rs"

[[bin]]
name = "eclass-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
html-escape = "0.3"
mime_guess = "2"
lopdf = { version = "0.47", default-features = false }
percent-encoding = "2"
regex = "1"
rookie-cookies = "0.6"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "charset",
    "multipart",
] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "io-std",
    "time",
    "process",
    "net",
    "sync",
] }
tokio-tungstenite = "0.29"
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
