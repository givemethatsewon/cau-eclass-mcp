name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra cdp
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv build --no-sources
      - run: uv run python scripts/check_dist.py
      - run: uv run python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: cau-eclass-mcp-${{ matrix.os }}
          path: dist/*
  cdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra cdp
      - run: uv run playwright install --with-deps chromium
      - name: Test real local CDP with synthetic site responses
        run: |
          export ECLASS_TEST_CHROME="$(uv run python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run pytest tests/test_cdp_browser.py -q
