name: Rust release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example rust-v0.1.0)
        required: true
        default: rust-v0.1.0
      prerelease:
        description: Mark as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          name="eclass-mcp-${target}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${target}/release/eclass-mcp-rs.exe" "dist/${name}/eclass-mcp.exe"
          else
            cp "target/${target}/release/eclass-mcp-rs" "dist/${name}/eclass-mcp"
            chmod +x "dist/${name}/eclass-mcp"
            strip "dist/${name}/eclass-mcp" || true
          fi
          cp README.md PORTING.md "dist/${name}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'")
            file="dist/${name}.zip"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            file="dist/${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$file")" > "$(basename "$file").sha256")
          fi
        env:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: eclass-mcp-${{ matrix.target }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.zip
            rust/dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Rust core ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release/*
