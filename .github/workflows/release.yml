name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to publish (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Verify version tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_REF'] == 'v' + version, 'Select the exact version tag'
          PY
      - run: uv sync --frozen --extra cdp
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run playwright install --with-deps chromium
      - name: Test real CDP protocol with synthetic data
        run: |
          export ECLASS_TEST_CHROME="$(uv run python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run pytest tests/test_cdp_browser.py -q
      - run: uv build --no-sources
      - run: uv run python scripts/check_dist.py
      - run: uv run python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cau-eclass-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
