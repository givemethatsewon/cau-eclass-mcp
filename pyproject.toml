[project]
name = "cau-eclass-mcp"
version = "0.5.0"
description = "Small OZ syllabus PDF export helper for CAU e-Class"
readme = "README.md"
license = "LicenseRef-CAU-EClass-Noncommercial-1.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "givemethatsewon" }]
keywords = ["canvas", "learningx", "cau", "oz", "playwright"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: Education"]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6,<7",
]

[project.urls]
Repository = "https://github.com/givemethatsewon/cau-eclass-mcp"
Issues = "https://github.com/givemethatsewon/cau-eclass-mcp/issues"
Documentation = "https://github.com/givemethatsewon/cau-eclass-mcp#readme"

[project.scripts]
eclass-oz-export = "eclass_mcp.oz_export:main"

[project.optional-dependencies]
oz = [
    "playwright>=1.60,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclass_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel.force-include]
"skills/cau-eclass/SKILL.md" = "eclass_mcp/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "NOTICE", "scripts/check_dist.py", "src/", "tests/", "skills/", "README.md", "pyproject.toml", "uv.lock"]
exclude = ["docs/verification.md"]
