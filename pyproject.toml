[project]
name = "cau-eclass-mcp"
version = "0.1.0"
description = "Local CAU Canvas/LearningX MCP server using an existing Aside session"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.1.4", "beautifulsoup4>=4.12,<5"]

[project.scripts]
eclass-mcp = "eclass_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclass_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
